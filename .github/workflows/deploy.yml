name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/**"
      - "README.md"
      - ".editorconfig"
      - ".gitignore"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(toJson(github.event.commits), '[skip ci]') && !contains(toJson(github.event.commits), '[ci skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: ${{ !contains(toJson(github.event.commits), '[skip ci]') && !contains(toJson(github.event.commits), '[ci skip]') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  version:
    needs: deploy
    if: ${{ !contains(toJson(github.event.commits), '[skip ci]') && !contains(toJson(github.event.commits), '[ci skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f version.properties ]; then
            echo "version=1.0.0" > version.properties
          fi

          update_header() {
            local ts="$1"
            if head -n 1 version.properties | grep -q '^# updated='; then
              sed -i "1s|^# updated=.*$|# updated=${ts}|" version.properties
            else
              { echo "# updated=${ts}"; cat version.properties; } > version.properties.tmp
              mv version.properties.tmp version.properties
            fi
          }

          set_version() {
            local ver="$1"
            if grep -q '^version=' version.properties; then
              sed -i "s/^version=.*/version=${ver}/" version.properties
            else
              echo "version=${ver}" >> version.properties
            fi
          }

          CURRENT_VERSION_LINE=$(grep -E '^version=' version.properties | tail -n 1 || true)
          CURRENT_VERSION="${CURRENT_VERSION_LINE#version=}"
          if [ -z "$CURRENT_VERSION" ]; then
            echo "version.properties has no version"
            exit 1
          fi

          VERSION_FILE_CHANGED=false
          if git diff --name-only HEAD~1 HEAD | grep -qx "version.properties"; then
            VERSION_FILE_CHANGED=true
          fi

          if [ "$VERSION_FILE_CHANGED" = "true" ]; then
            COMMIT_TIME=$(git show -s --format=%cI HEAD)
            update_header "$COMMIT_TIME"
            if ! git diff --quiet -- version.properties; then
              git add version.properties
              git commit -m "[skip ci] bump version to v${CURRENT_VERSION} [skip ci]"
              git push
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            if [ -z "${MAJOR:-}" ] || [ -z "${MINOR:-}" ] || [ -z "${PATCH:-}" ]; then
              echo "version must be MAJOR.MINOR.PATCH"
              exit 1
            fi
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            update_header "$NOW"
            set_version "$NEW_VERSION"
            git add version.properties
            git commit -m "[skip ci] bump version to v${NEW_VERSION}"
            git push
          fi

          FINAL_VERSION_LINE=$(grep -E '^version=' version.properties | tail -n 1)
          FINAL_VERSION="${FINAL_VERSION_LINE#version=}"

          git fetch --tags
          TAG="v${FINAL_VERSION}"
          git tag "${TAG}"
          git push origin "${TAG}"

          # Keep only the latest 5 version tags (semver order)
          TAGS_TO_DELETE=$(git tag -l "v*" --sort=-v:refname | tail -n +6)
          if [ -n "$TAGS_TO_DELETE" ]; then
            echo "$TAGS_TO_DELETE" | xargs -I {} git tag -d {}
            echo "$TAGS_TO_DELETE" | xargs -I {} git push origin :refs/tags/{}
          fi

  publish_packages:
    needs: version
    if: ${{ !contains(toJson(github.event.commits), '[skip ci]') && !contains(toJson(github.event.commits), '[ci skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Detect packages to publish and bump changed versions
        id: detect_and_bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t all_package_dirs < <(
            find packages -mindepth 1 -maxdepth 1 -type d \
              | xargs -n 1 basename \
              | sort -u
          )

          mapfile -t changed_package_dirs < <(
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'packages/*' \
              | awk -F/ 'NF >= 2 {print $2}' \
              | sort -u
          )

          if [ "${#all_package_dirs[@]}" -eq 0 ]; then
            echo "publish_packages=" >> "$GITHUB_OUTPUT"
            echo "No packages found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          declare -A changed_lookup=()
          for package_short_name in "${changed_package_dirs[@]}"; do
            changed_lookup["$package_short_name"]=1
          done

          publish_csv=""
          version_bumped=false

          for package_short_name in "${all_package_dirs[@]}"; do
            package_file="packages/${package_short_name}/package.json"
            package_name="$(node -p "require('./${package_file}').name")"
            current_version="$(node -p "require('./${package_file}').version")"
            previous_version=""
            published_version="$(npm view "$package_name" version 2>/dev/null || true)"

            if [ -z "$published_version" ]; then
              echo "Unpublished package detected: ${package_name}@${current_version}"
              if [ -n "$publish_csv" ]; then
                publish_csv="${publish_csv},"
              fi
              publish_csv="${publish_csv}${package_short_name}"
              continue
            fi

            if [ -z "${changed_lookup[$package_short_name]:-}" ]; then
              echo "Skip unchanged published package: ${package_name}@${published_version}"
              continue
            fi

            if git cat-file -e "${BEFORE_SHA}:${package_file}" 2>/dev/null; then
              previous_version="$(git show "${BEFORE_SHA}:${package_file}" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            fi

            if [ -z "$previous_version" ]; then
              echo "New package detected: ${package_short_name}@${current_version}"
            elif [ "$previous_version" = "$current_version" ]; then
              node scripts/bump-package-version.mjs "$package_short_name" patch
              version_bumped=true
            else
              echo "Keep manually updated version for ${package_short_name}: ${previous_version} -> ${current_version}"
            fi

            if [ -n "$publish_csv" ]; then
              publish_csv="${publish_csv},"
            fi
            publish_csv="${publish_csv}${package_short_name}"
          done

          if [ "$version_bumped" = true ]; then
            git add packages/*/package.json
            git commit -m "[skip ci] chore: 패키지 버전 자동 증가"
            git push origin HEAD:main
          fi

          echo "publish_packages=${publish_csv}" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: ${{ steps.detect_and_bump.outputs.publish_packages != '' }}
        run: npm run build:packages

      - name: Publish packages
        if: ${{ steps.detect_and_bump.outputs.publish_packages != '' }}
        env:
          PUBLISH_PACKAGES: ${{ steps.detect_and_bump.outputs.publish_packages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required to publish packages."
            exit 1
          fi

          IFS=',' read -r -a publish_package_dirs <<< "$PUBLISH_PACKAGES"

          for package_short_name in "${publish_package_dirs[@]}"; do
            package_file="packages/${package_short_name}/package.json"
            package_name="$(node -p "require('./${package_file}').name")"
            current_version="$(node -p "require('./${package_file}').version")"

            echo "Publishing ${package_name}@${current_version}"
            npm publish --workspace "$package_name" --access public

            tag_name="${package_short_name}-v${current_version}"
            if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
              echo "Tag already exists: ${tag_name}"
              continue
            fi

            git tag "${tag_name}"
            git push origin "${tag_name}"
          done
